name: Docker Image Publish

on:
  workflow_dispatch:
  release:
      types: [published]

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: softwareunderstanding/rsmetacheck
    IMAGE_TAG: ${{ github.event.release.tag_name || 'test' }}
    USERNAME: ${{ github.actor }}
jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Log in to GitHub Container Registry
              if: github.event_name == 'release' && github.repository == 'SoftwareUnderstanding/rsmetacheck'
              uses: docker/login-action@v4
              with:
                registry: ${{ env.REGISTRY }}
                username: ${{ env.USERNAME }}
                password: ${{ secrets.GITHUB_TOKEN }}
            - name: build docker image
              run: docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .
            - name: test docker image
              run: docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} rsmetacheck --help
            - name: push docker image
              if: github.event_name == 'release' && github.repository == 'SoftwareUnderstanding/rsmetacheck'
              run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
